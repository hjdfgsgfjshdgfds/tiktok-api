name: Format verification ledger

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format verification ledger
        run: npx prettier --write VERIFICATION.md

      - name: Commit formatted ledger
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- VERIFICATION.md; then
            echo 'Verification ledger is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERIFICATION.md
          git commit -m 'docs: format verification ledger [skip ci]'
          git push
